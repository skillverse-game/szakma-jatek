<style>

:root[data-theme="dark"]{--bg:#10151c;--panel:rgba(22,29,39,.92);--ink:#eef1f5;--mute:#a3adba;--line:#344052;--acc:#5ec0de;--good:#5fd08c;--bad:#ff8a76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:min(720px,100%);max-height:62vh;overflow-y:auto;backdrop-filter:blur(8px)}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:.2px}
h2{margin:0 0 6px;font-size:1.05rem;color:var(--mute);font-weight:600}
p{margin:6px 0 12px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left}
button:hover,button:focus-visible{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:1px}
.prof{font-size:1.05rem;text-align:center;padding:16px 8px}
.prof span{display:block;font-size:2rem;margin-bottom:4px}
.opt{display:block;width:100%;margin-top:8px}
.primary{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center;margin-top:8px}
.fb{border-left:4px solid var(--line);padding:6px 12px;margin:10px 0}
.fb.good{border-color:var(--good)}.fb.bad{border-color:var(--bad)}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem}
</style>
</head>
